<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent MCP Dashboard</title>
    <meta name="description" content="Dashboard for Dev Agent MCP">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-glow: rgba(99, 102, 241, 0.5);
            --success: #10b981;
            --primary: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 2rem 0;
            text-align: center;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(236, 72, 153, 0.3);
        }

        .container {
            width: 95%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .glass-panel:hover {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-top: 0;
            font-weight: 600;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
            animation: pulse 2s infinite;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        /* Chat Styles */
        .chat-box {
            flex-grow: 1;
            min-height: 250px;
            max-height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-right: 0.5rem;
        }

        .chat-msg {
            max-width: 80%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg-user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            border-bottom-right-radius: 2px;
        }

        .msg-agent {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-bottom-left-radius: 2px;
        }

        .chat-input-row {
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            color: white;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary);
        }

        .chat-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 1.5rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .chat-btn:hover {
            background: #7c3aed;
        }
        
        .chat-btn:active {
            transform: scale(0.95);
        }

        /* Event Styles */
        .event-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 600px;
            overflow-y: auto;
        }

        .event-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .event-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .event-time {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .event-type {
            font-weight: 600;
            color: #e2e8f0;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Agent MCP Dashboard</h1>
    </header>

    <div class="container">
        
        <!-- LEFT COLUMN: Status & Chat -->
        <div class="left-col">
            <div class="glass-panel" id="status-panel">
                <h2>Current Status</h2>
                <div class="status-badge" id="status-display">
                    <div class="status-dot"></div>
                    <span id="status-text">Loading...</span>
                </div>
                <p style="color: var(--text-muted); margin-top: 1.5rem; line-height: 1.6;">
                    The Agent MCP is currently running. Storage is set to a <strong>local temp JSON file</strong>.
                </p>
            </div>

            <div class="glass-panel" style="flex-grow: 1;">
                <h2>Agent Chat</h2>
                <div class="chat-box" id="chat-box">
                    <div class="chat-msg msg-agent">Hello! I am your Dev Agent. You can send me commands or chat with me. Try sending "ping"!</div>
                </div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Message the agent..." autocomplete="off">
                    <button id="chat-btn" class="chat-btn">Send</button>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Events -->
        <div class="glass-panel" style="height: fit-content;">
            <h2>Recent Events</h2>
            <ul class="event-list" id="events-list">
                <!-- Events injected via JS -->
            </ul>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('status-text').innerText = data.status.toUpperCase();
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerText = "ERROR";
            }
        }

        async function fetchEvents() {
            try {
                const res = await fetch('/api/events');
                const events = await res.json();
                const list = document.getElementById('events-list');
                list.innerHTML = '';

                // Reverse so newest is first
                events.reverse().forEach(event => {
                    const li = document.createElement('li');
                    li.className = 'event-item';
                    
                    const date = new Date(event.timestamp);
                    const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    let payloadStr = '';
                    if (event.payload) {
                        payloadStr = JSON.stringify(event.payload);
                    }

                    li.innerHTML = `
                        <div>
                            <div class="event-type">${event.type}</div>
                            <div class="event-payload" style="font-size: 0.85rem; color: #cbd5e1; margin-top: 0.25rem;">
                                ${payloadStr}
                            </div>
                        </div>
                        <div class="event-time">${timeString}</div>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // --- Chat Logic ---
        const chatInput = document.getElementById('chat-input');
        const chatBtn = document.getElementById('chat-btn');
        const chatBox = document.getElementById('chat-box');

        function appendMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = 'chat-msg ' + (isUser ? 'msg-user' : 'msg-agent');
            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // 1. Show user message
            appendMessage(text, true);
            chatInput.value = '';

            try {
                // 2. Send to backend
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                
                // 3. Show agent reply
                if (data.reply) {
                    appendMessage(data.reply, false);
                }
            } catch(err) {
                appendMessage("Error: Could not reach agent backend.", false);
            }
            
            // Immediately fetch events to show the chat event log
            fetchEvents();
        }

        chatBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });


        // Initial fetch
        fetchStatus();
        fetchEvents();

        // Poll every 2 seconds
        setInterval(() => {
            fetchStatus();
            fetchEvents();
        }, 2000);
    </script>
</body>
</html>
