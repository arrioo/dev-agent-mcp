<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard</title>
    <meta name="description" content="Dashboard for Dev Agent MCP">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F7F7F5;
            color: #111111;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom elegant scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body class="min-h-screen p-6 md:p-12">

    <header class="max-w-7xl mx-auto mb-10 border-b border-gray-200 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-semibold tracking-tight text-[#111111]">Agent Dashboard</h1>
            <p class="text-sm text-gray-500 mt-1">Model Context Protocol • Local File Storage</p>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-sm font-medium text-gray-500">System Status</span>
            <div class="flex items-center gap-2 px-3 py-1.5 bg-white border border-gray-200 rounded-full shadow-sm">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span id="status-text" class="text-sm font-semibold text-gray-800 uppercase tracking-wide">Loading...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Left Column: Command Interface (Chat) -->
        <div class="lg:col-span-7 flex flex-col h-[650px]">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                    <h2 class="text-xs font-bold tracking-widest text-gray-500 uppercase">Command Interface</h2>
                    <button id="clear-btn" class="text-xs text-gray-400 hover:text-gray-700 font-medium transition-colors">Clear chat</button>
                </div>

                <!-- Provider settings -->
                <div class="px-6 py-3 border-b border-gray-100 grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <select id="provider-select" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-xs text-[#111111] focus:outline-none focus:ring-2 focus:ring-gray-200 focus:bg-white">
                        <option>Loading providers...</option>
                    </select>
                    <input type="text" id="model-input" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-xs font-mono focus:outline-none focus:ring-2 focus:ring-gray-200 focus:bg-white" placeholder="Model (default)" autocomplete="off">
                    <input type="password" id="key-input" class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-xs font-mono focus:outline-none focus:ring-2 focus:ring-gray-200 focus:bg-white disabled:opacity-50" placeholder="API key" autocomplete="off">
                </div>

                <div id="chat-box" class="flex-grow p-6 overflow-y-auto flex flex-col gap-4">
                    <div class="self-start bg-gray-50 border border-gray-100 text-gray-800 rounded-lg rounded-tl-none px-4 py-3 text-sm max-w-[85%] shadow-sm">
                        System initialized. Pick a provider, add an API key (or use the one in .env), and send a message.
                    </div>
                </div>

                <div class="p-4 border-t border-gray-100 bg-white">
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-400 text-sm font-mono font-bold">&gt;</span>
                        <input type="text" id="chat-input" class="w-full pl-9 pr-24 py-3.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-[#111111] focus:outline-none focus:ring-2 focus:ring-gray-200 focus:bg-white transition-all font-mono" placeholder="Enter command..." autocomplete="off">
                        <button id="chat-btn" class="absolute right-2 px-5 py-2 bg-[#111111] hover:bg-gray-800 text-white text-sm font-medium rounded-md transition-colors shadow-sm disabled:opacity-50">
                            Execute
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Event Log -->
        <div class="lg:col-span-5 flex flex-col h-[650px]">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                    <h2 class="text-xs font-bold tracking-widest text-gray-500 uppercase">Event Log</h2>
                    <span class="text-xs text-gray-400 font-mono bg-white px-2 py-1 rounded border border-gray-200 shadow-sm">storage/temp/data.json</span>
                </div>

                <ul id="events-list" class="flex-grow overflow-y-auto p-4 flex flex-col gap-3">
                    <!-- Events injected via JS -->
                </ul>
            </div>
        </div>

    </main>

    <script>
        // Escape text before putting it into innerHTML (chat text ends up in the event log)
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('status-text').innerText = data.status.toUpperCase();
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerText = "ERROR";
            }
        }

        async function fetchEvents() {
            try {
                const res = await fetch('/api/events');
                const events = await res.json();
                const list = document.getElementById('events-list');
                list.innerHTML = '';

                // Reverse so newest is first
                events.reverse().forEach(event => {
                    const li = document.createElement('li');
                    li.className = 'bg-gray-50 border border-gray-100 rounded-lg p-4 flex flex-col gap-2 transition-colors hover:bg-gray-100/50';

                    const date = new Date(event.timestamp);
                    const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                    let payloadStr = '';
                    if (event.payload) {
                        payloadStr = JSON.stringify(event.payload, null, 2);
                    }

                    li.innerHTML = `
                        <div class="flex justify-between items-start w-full">
                            <span class="font-semibold text-sm text-[#111111]">${escapeHtml(event.type)}</span>
                            <span class="text-xs text-gray-400 font-mono">${timeString}</span>
                        </div>
                        ${payloadStr ? `<pre class="text-xs text-gray-500 font-mono bg-white p-2 rounded border border-gray-100 overflow-x-auto">${escapeHtml(payloadStr)}</pre>` : ''}
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // --- Provider settings ---
        const providerSel = document.getElementById('provider-select');
        const modelInput = document.getElementById('model-input');
        const keyInput = document.getElementById('key-input');
        let providers = [];

        function currentProvider() {
            return providers.find(p => p.id === providerSel.value);
        }

        function applyProvider() {
            const p = currentProvider();
            if (!p) return;
            modelInput.placeholder = p.default_model;
            modelInput.value = localStorage.getItem('model:' + p.id) || '';
            // API keys live in sessionStorage only: cleared when the tab closes
            keyInput.value = sessionStorage.getItem('apikey:' + p.id) || '';
            keyInput.disabled = !p.needs_key;
            keyInput.placeholder = !p.needs_key
                ? 'No key needed'
                : p.key_in_env ? 'API key (blank = use server .env)' : 'API key';
        }

        async function loadProviders() {
            try {
                const res = await fetch('/api/providers');
                providers = await res.json();
                providerSel.innerHTML = providers
                    .map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}${p.key_in_env ? ' ✓' : ''}</option>`)
                    .join('');
                const saved = localStorage.getItem('provider');
                if (saved && providers.some(p => p.id === saved)) providerSel.value = saved;
                applyProvider();
            } catch (err) {
                console.error(err);
                providerSel.innerHTML = '<option>Failed to load providers</option>';
            }
        }

        providerSel.addEventListener('change', () => {
            localStorage.setItem('provider', providerSel.value);
            applyProvider();
        });
        modelInput.addEventListener('input', () => {
            localStorage.setItem('model:' + providerSel.value, modelInput.value.trim());
        });
        keyInput.addEventListener('input', () => {
            sessionStorage.setItem('apikey:' + providerSel.value, keyInput.value.trim());
        });

        // --- Chat/Command Logic ---
        const chatInput = document.getElementById('chat-input');
        const chatBtn = document.getElementById('chat-btn');
        const chatBox = document.getElementById('chat-box');
        const clearBtn = document.getElementById('clear-btn');
        const history = []; // [{role: 'user'|'assistant', content}]

        function appendMessage(text, isUser, isError = false) {
            const msg = document.createElement('div');

            if (isUser) {
                msg.className = 'self-end bg-[#111111] text-white rounded-lg rounded-tr-none px-4 py-3 text-sm max-w-[85%] shadow-sm whitespace-pre-wrap';
            } else if (isError) {
                msg.className = 'self-start bg-red-50 border border-red-100 text-red-700 rounded-lg rounded-tl-none px-4 py-3 text-sm max-w-[85%] shadow-sm whitespace-pre-wrap';
            } else {
                msg.className = 'self-start bg-gray-50 border border-gray-100 text-gray-800 rounded-lg rounded-tl-none px-4 py-3 text-sm max-w-[85%] shadow-sm whitespace-pre-wrap';
            }

            msg.innerText = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msg;
        }

        async function typeWriter(element, text, speed = 15) {
            element.innerText = '';
            let i = 0;
            return new Promise((resolve) => {
                function type() {
                    if (i < text.length) {
                        element.innerText += text.charAt(i);
                        i++;
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        resolve();
                    }
                }
                type();
            });
        }

        function setBusy(busy) {
            chatBtn.disabled = busy;
            chatInput.disabled = busy;
            chatBtn.innerText = busy ? '...' : 'Execute';
            if (!busy) chatInput.focus();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            chatInput.value = '';
            setBusy(true);
            const thinking = appendMessage('Thinking...', false);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        provider: providerSel.value,
                        model: modelInput.value.trim(),   // empty = provider default
                        api_key: keyInput.value.trim(),   // empty = server .env
                        message: text,
                        history: history
                    })
                });
                const data = await res.json();
                thinking.remove();

                if (!res.ok) {
                    appendMessage(data.error || ('Request failed (' + res.status + ')'), false, true);
                } else if (data.reply) {
                    const msgEl = appendMessage('', false);
                    await typeWriter(msgEl, data.reply);
                    history.push({ role: 'user', content: text });
                    history.push({ role: 'assistant', content: data.reply });
                }
            } catch (err) {
                thinking.remove();
                appendMessage('Could not reach agent backend.', false, true);
            }

            setBusy(false);
            fetchEvents();
        }

        clearBtn.addEventListener('click', () => {
            history.length = 0;
            chatBox.innerHTML = '';
            appendMessage('Chat cleared.', false);
        });

        chatBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial fetch
        loadProviders();
        fetchStatus();
        fetchEvents();

        // Poll every 2 seconds
        setInterval(() => {
            fetchStatus();
            fetchEvents();
        }, 2000);
    </script>
</body>
</html>
